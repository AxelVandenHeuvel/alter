<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Alter</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        width: 260px;
        padding: 16px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #fff;
        color: #17171c;
      }
      header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
      header img { display: block; flex-shrink: 0; }
      h1 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.3; }
      p { margin: 0; color: #6b6b78; }
      @media (prefers-color-scheme: dark) {
        body { background: #1b1b21; color: #ececf1; }
        p { color: #a0a0ad; }
      }
    </style>
  </head>
  <body>
    <header>
      <img src="/icon/48.png" width="28" height="28" alt="" />
      <h1>Alter can't change this page</h1>
    </header>
    <p>Alter works on regular websites. Browser pages like settings, new tabs, and the Chrome Web Store can't be changed by extensions.</p>
  </body>
</html>
